# SonarCloud — análise opcional do pipeline DevSecOps (.github/workflows/devsecops.yml).
# Só roda quando o secret SONAR_TOKEN existe; a organização vem do secret
# SONAR_ORGANIZATION (passada como -Dsonar.organization no workflow).
# Ajuste projectKey para a chave criada no SonarCloud (padrão: <organizacao>_<repositorio>).
sonar.projectKey=agrosmart
sonar.projectName=AgroSmart
sonar.projectVersion=7.0.0

sonar.sources=src,app
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.python.version=3.13

# Relatórios gerados pelo job `testes` (baixados como artifact antes da análise).
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=junit.xml

# Simuladores geram dados sintéticos; não entram na métrica de duplicação.
sonar.cpd.exclusions=src/agrosmart/simuladores/**
