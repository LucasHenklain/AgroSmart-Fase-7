# AgroSmart Fase 7 — Prometheus: coleta as métricas do worker e do MinIO e avalia
# as regras de alerta de alertas.yml (visíveis em http://localhost:9090/alerts).
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    plataforma: agrosmart

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  - job_name: agrosmart-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:8000"]
        labels:
          servico: worker

  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["minio:9000"]
        labels:
          servico: lake

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
