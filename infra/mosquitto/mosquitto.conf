# ---------------------------------------------------------------------------
# AgroSmart Fase 6 - broker MQTT local (Eclipse Mosquitto 2.x)
#
# Só para desenvolvimento e demonstração: escuta em localhost, aceita conexão
# anônima e não persiste nada. Em campo o broker ficaria atrás de TLS (8883)
# com usuário/senha por dispositivo e ACL por tópico - fora do escopo da PoC.
# ---------------------------------------------------------------------------
listener 1883
allow_anonymous true
persistence false

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
