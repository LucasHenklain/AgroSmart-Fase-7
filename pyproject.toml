[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agrosmart"
version = "7.0.0"
description = "AgroSmart Fase 7 - plataforma completa: IoT (MQTT), Data Lake, automação, operação contínua monitorada, DevSecOps e mineração de processos"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # CLI e apresentação
    "typer>=0.12",
    "rich>=13.7",
    # Configuração e contratos
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    # Armazenamento S3-compatível (MinIO)
    "boto3>=1.34",
    # Processamento e formato colunar
    "polars>=1.0",
    "pyarrow>=16.0",
    "duckdb>=1.0",
    # Base de fusos IANA: o Windows não a traz, e todo timestamp do lake é tz-aware (UTC)
    "tzdata>=2024.1",
    # Fontes externas
    "requests>=2.33",
    "Pillow>=13.0",
    # Pisos de segurança de dependências transitivas (SCA/pip-audit, Fase 7): impedem que
    # um ambiente antigo continue com versões com CVE corrigida. Ver
    # docs/fase7/03-pipeline-devsecops.md.
    "urllib3>=2.8",
    "certifi>=2026.10.18",
    "pygments>=2.20",
]

[project.optional-dependencies]
ia = ["anthropic>=0.40", "anyio>=4.14.2"]
# Fase 7: mineração de processos (pm4py é AGPL — uso acadêmico; sem ele, fallback em Python puro)
processos = ["pm4py>=2.7", "pandas>=2.2", "matplotlib>=3.8"]
app = [
    "streamlit>=1.36",
    "altair>=5.3",
    # pisos de segurança das transitivas do Streamlit (pip-audit)
    "gitpython>=3.2.1",
    "python-multipart>=0.0.31",
    "anyio>=4.14.2",
]
iot = ["paho-mqtt>=2.0"]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5"]

[project.scripts]
agrosmart = "agrosmart.pipeline:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agrosmart = ["ia/prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Texto em português para o produtor (frases das recomendações, relatórios): a
# legibilidade da frase vale mais que o limite de coluna do código.
"src/agrosmart/ia/regras.py" = ["E501"]
"src/agrosmart/ia/render.py" = ["E501"]
"src/agrosmart/ia/avaliacao.py" = ["E501"]
# Dashboard: rótulos, legendas e chamadas declarativas do Streamlit/Altair — quebrar
# cada argumento em uma linha triplicaria o arquivo sem ganhar clareza.
"app/dashboard.py" = ["E501"]

# --- DevSecOps (docs/fase7/03-pipeline-devsecops.md) ---------------------------------
[tool.bandit]
# SAST roda em src/ e app/ (código que vai para a imagem). Nenhuma regra é desligada
# globalmente: falsos positivos são justificados linha a linha com `# nosec BXXX`.
exclude_dirs = ["tests", "scripts", ".venv", "build"]

[tool.coverage.run]
source = ["agrosmart"]
branch = true

[tool.coverage.report]
skip_empty = true
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
