# Atualizações automáticas que alimentam o pipeline DevSecOps: ações do GitHub (fixadas
# por versão no workflow), dependências Python (pyproject.toml) e imagem base do Dockerfile.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
