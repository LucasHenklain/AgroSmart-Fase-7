<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="seta" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#546e7a"/>
    </marker>
    <marker id="seta-vermelha" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#c62828"/>
    </marker>
    <style>
      .caixa { fill: #ffffff; stroke: #37474f; stroke-width: 1.3; rx: 6; }
      .origem { fill: #f5f5f5; stroke: #90a4ae; }
      .bronze { fill: #fbe9e7; stroke: #bf360c; }
      .silver { fill: #eceff1; stroke: #455a64; }
      .gold { fill: #fff8e1; stroke: #f9a825; }
      .quarentena { fill: #ffebee; stroke: #c62828; }
      .consumo { fill: #e8f5e9; stroke: #2e7d32; }
      .meta { fill: #e3f2fd; stroke: #1565c0; stroke-dasharray: 5 3; }
      .t { font-size: 13px; font-weight: 700; fill: #263238; }
      .s { fill: #37474f; }
      .m { font-size: 11px; fill: #546e7a; }
      .fluxo { stroke: #546e7a; stroke-width: 1.6; fill: none; marker-end: url(#seta); }
      .rejeita { stroke: #c62828; stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; marker-end: url(#seta-vermelha); }
      .rotulo { font-size: 11px; fill: #37474f; font-style: italic; }
    </style>
  </defs>
  <rect width="1240" height="700" fill="#fafafa"/>
  <text x="24" y="34" font-size="20" font-weight="700" fill="#263238">AgroSmart · Fluxo de ingestão, qualidade e refino</text>
  <text x="24" y="54" class="m">Um contrato por fonte (contratos/*.yaml) governa cada etapa: schema na porta, tipagem, regras, dedup, partição, retenção, LGPD. Números da execução de referência (30 dias, 6 talhões).</text>

  <!-- 1. Origens -->
  <rect x="24" y="90" width="200" height="250" class="caixa origem"/>
  <text x="36" y="112" class="t">1 · Origens → landing/</text>
  <text x="36" y="136" class="s">Gateway MQTT (12 sensores)</text>
  <text x="36" y="152" class="m">JSONL a cada 15 min · 2.892 lotes</text>
  <text x="36" y="176" class="s">API de clima (2 estações)</text>
  <text x="36" y="192" class="m">JSON envelope · 60 respostas</text>
  <text x="36" y="216" class="s">ERP: talhões e operações</text>
  <text x="36" y="232" class="m">CSV completo · CSV incremental</text>
  <text x="36" y="256" class="s">Drone / satélite</text>
  <text x="36" y="272" class="m">JPEG + sidecar · 60 cenas</text>
  <text x="36" y="296" class="s">Laboratório de solo</text>
  <text x="36" y="312" class="m">PDF + sidecar · 8 laudos</text>
  <text x="36" y="332" class="m">(na demonstração: simuladores)</text>

  <!-- 2. Coletores -->
  <rect x="264" y="90" width="210" height="250" class="caixa"/>
  <text x="276" y="112" class="t">2 · Coletores (por modo)</text>
  <text x="276" y="136" class="s">streaming · sensores</text>
  <text x="276" y="156" class="s">api_pull · clima</text>
  <text x="276" y="176" class="s">batch · erp_talhoes, erp_operacoes</text>
  <text x="276" y="196" class="s">watch_folder · imagens, laudos</text>
  <text x="276" y="226" class="t">3 · Validação na porta</text>
  <text x="276" y="246" class="m">cabeçalho do CSV = campos do contrato</text>
  <text x="276" y="262" class="m">chaves do JSON ⊆ contrato</text>
  <text x="276" y="278" class="m">envelope da API e séries alinhadas</text>
  <text x="276" y="294" class="m">binário presente e não vazio</text>
  <text x="276" y="318" class="m">batch_id = sha256(fonte|janela|nome)[:16]</text>
  <text x="276" y="332" class="m">mesmo checksum → pulado · novo → versão +1</text>

  <!-- 4. Bronze -->
  <rect x="514" y="90" width="220" height="150" class="caixa bronze"/>
  <text x="526" y="112" class="t">4 · Bronze (bruto)</text>
  <text x="526" y="134" class="s">bytes idênticos à origem</text>
  <text x="526" y="152" class="s">&lt;fonte&gt;/ano=/mes=/dia=/&lt;arquivo&gt;</text>
  <text x="526" y="170" class="s">metadados no objeto + manifest/lote</text>
  <text x="526" y="188" class="m">3.081 lotes · 6.230 objetos · 0 rejeitados</text>
  <text x="526" y="206" class="m">versionamento ligado · append-only</text>
  <text x="526" y="224" class="m">retenção por contrato (90 / 365 / 1.825 d)</text>

  <!-- Quarentena rejeitados -->
  <rect x="514" y="262" width="220" height="78" class="caixa quarentena"/>
  <text x="526" y="284" class="t">Quarentena · _rejeitados/</text>
  <text x="526" y="304" class="s">lote fora do contrato, com _motivo.json</text>
  <text x="526" y="322" class="m">nunca entra no bronze · evento lote_rejeitado</text>

  <!-- 5. Motor de qualidade -->
  <rect x="774" y="90" width="220" height="250" class="caixa silver"/>
  <text x="786" y="112" class="t">5 · Leitura, tipagem, qualidade</text>
  <text x="786" y="134" class="s">texto → tipos do contrato (TIP-01)</text>
  <text x="786" y="152" class="s">unidades canônicas · UTC</text>
  <text x="786" y="176" class="s">58 regras: nao_nulo, intervalo,</text>
  <text x="786" y="192" class="s">dominio, regex, nao_futuro,</text>
  <text x="786" y="208" class="s">referencia, comparacao, unicidade</text>
  <text x="786" y="232" class="s">dedup: evento × versão</text>
  <text x="786" y="250" class="s">frescor por entidade (lacunas)</text>
  <text x="786" y="268" class="s">pseudonimização (LGPD)</text>
  <text x="786" y="296" class="m">crítica → quarentena · alerta → _alertas</text>
  <text x="786" y="314" class="m">declarados = lidos = aprovados</text>
  <text x="786" y="330" class="m">+ quarentena + substituídos</text>

  <!-- 6. Silver -->
  <rect x="1034" y="90" width="182" height="110" class="caixa silver"/>
  <text x="1046" y="112" class="t">6 · Silver (confiável)</text>
  <text x="1046" y="134" class="s">Parquet zstd por dia de evento</text>
  <text x="1046" y="152" class="s">6 tabelas · _batch_id, _alertas</text>
  <text x="1046" y="170" class="m">34.208 aprovados</text>
  <text x="1046" y="188" class="m">_substituidos/ · 181 versões</text>

  <!-- Quarentena registros -->
  <rect x="1034" y="220" width="182" height="120" class="caixa quarentena"/>
  <text x="1046" y="242" class="t">Quarentena · registros</text>
  <text x="1046" y="262" class="s">Parquet por data de ingestão</text>
  <text x="1046" y="280" class="s">_regras_violadas · _motivo</text>
  <text x="1046" y="298" class="m">405 reprovados</text>
  <text x="1046" y="316" class="m">406/406 defeitos injetados</text>
  <text x="1046" y="332" class="m">localizados (verdade-terreno)</text>

  <!-- 7. Gold -->
  <rect x="774" y="390" width="220" height="130" class="caixa gold"/>
  <text x="786" y="412" class="t">7 · Gold (refinado)</text>
  <text x="786" y="434" class="s">14 tabelas SQL (DuckDB)</text>
  <text x="786" y="452" class="s">dim_talhao, fato_balanco_hidrico,</text>
  <text x="786" y="470" class="s">fato_ndvi_talhao, benchmark_regional…</text>
  <text x="786" y="494" class="m">recomputado do silver a cada execução</text>
  <text x="786" y="510" class="m">k-anonimato no agregado externo</text>

  <!-- 8. Consumo -->
  <rect x="1034" y="390" width="182" height="130" class="caixa consumo"/>
  <text x="1046" y="412" class="t">8 · Consumo</text>
  <text x="1046" y="434" class="s">Copiloto de IA (Context Pack)</text>
  <text x="1046" y="452" class="s">Dashboard (Streamlit)</text>
  <text x="1046" y="470" class="s">SQL ad hoc · agrosmart sql</text>
  <text x="1046" y="488" class="s">Produto de dados (degrau 3)</text>
  <text x="1046" y="510" class="m">lê só o gold</text>

  <!-- Metadados transversais -->
  <rect x="24" y="390" width="710" height="130" class="caixa meta"/>
  <text x="36" y="412" class="t">Transversal · administração e manutenção</text>
  <text x="36" y="436" class="s">• Trilha de eventos JSONL por lote e etapa (outputs/logs/eventos.jsonl)</text>
  <text x="36" y="454" class="s">• Relatório de qualidade e reconciliação por fonte (outputs/dq_report.json) → fato_alerta_qualidade</text>
  <text x="36" y="472" class="s">• Catálogo, linhagem (bronze → silver → gold) e dicionário gerados (agrosmart catalogo)</text>
  <text x="36" y="490" class="s">• Compactação e retenção por contrato (agrosmart manter) · versionamento e ciclo de vida no bucket</text>
  <text x="36" y="508" class="s">• Orquestração agrosmart run --all · backfill run --from --to · runbook INC-01…05</text>

  <!-- Setas -->
  <path d="M224,215 L262,215" class="fluxo"/>
  <path d="M474,165 L512,165" class="fluxo"/>
  <text x="478" y="158" class="rotulo">ok</text>
  <path d="M474,300 L512,300" class="rejeita"/>
  <text x="478" y="293" class="rotulo" fill="#c62828">schema ≠</text>
  <path d="M734,165 L772,165" class="fluxo"/>
  <text x="738" y="158" class="rotulo">lotes + manifests</text>
  <path d="M994,145 L1032,145" class="fluxo"/>
  <text x="998" y="138" class="rotulo">aprovados</text>
  <path d="M994,280 L1032,280" class="rejeita"/>
  <text x="998" y="273" class="rotulo" fill="#c62828">reprovados</text>
  <path d="M1125,200 L1125,240 L1030,240 L1030,380 L884,380 L884,388" class="fluxo"/>
  <text x="890" y="376" class="rotulo">silver completo</text>
  <path d="M994,455 L1032,455" class="fluxo"/>

  <text x="24" y="560" class="m">Legenda: setas cheias = caminho do dado aprovado · setas tracejadas vermelhas = reprovação (na porta ou no registro) · caixa azul tracejada = metadados que atravessam todas as camadas.</text>
  <text x="24" y="578" class="m">Bronze particiona pela janela do lote; silver reparticiona pela coluna de evento do contrato; quarentena particiona pela data de ingestão (é dela que a retenção de 30 dias conta).</text>
  <text x="24" y="610" class="m">docs/02-ingestao-e-manutencao.md · docs/01-arquitetura-datalake.md · AgroSmart Fase 5 · setembro/2026</text>
</svg>
