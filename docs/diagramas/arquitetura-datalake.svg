<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1028 600" width="1028" height="600" role="img" aria-label="Arquitetura do Data Lake AgroSmart">
  <title>Arquitetura do Data Lake AgroSmart — Fase 5</title>
  <style>
    .fundo { fill: #FBFCFA; }
    .box { fill: #E9ECE6; stroke: #B9C1B5; }
    .band { fill: #DDEAE1; stroke: #2C6A4C; stroke-opacity: .45; }
    .quar { fill: #F6E3DE; stroke: #9E3320; stroke-opacity: .5; }
    .chip { fill: #FBFCFA; stroke: #D5DAD1; }
    .titulo { font-family: Georgia, "Times New Roman", serif; font-size: 14px; font-weight: 600; fill: #191E1A; }
    .sub { font-family: Consolas, "Cascadia Mono", monospace; font-size: 8.6px; letter-spacing: .09em; fill: #616B62; }
    .chiptxt { font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-size: 10.5px; fill: #3D463F; }
    .stage { font-family: Consolas, "Cascadia Mono", monospace; font-size: 8.6px; letter-spacing: .14em; fill: #616B62; }
    .arrow { stroke: #B9C1B5; stroke-width: 1.4; fill: none; }
    .head { fill: #B9C1B5; }
    .r-bronze { fill: #8A5A2B; } .r-prata { fill: #6F7C77; } .r-ouro { fill: #9C7A1E; } .r-quar { fill: #9E3320; }
  </style>
